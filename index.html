<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Хочу узнать тебя лучше!</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="lang-switch" aria-label="Language switcher">
    <button type="button" class="lang-switch__btn" data-lang="ru">RU</button>
    <button type="button" class="lang-switch__btn" data-lang="uz">UZ</button>
    <button type="button" class="lang-switch__btn" data-lang="en">EN</button>
  </div>

  <div id="progress-wrap">
    <div class="progress-bar-track">
      <div id="progress-bar-fill"></div>
    </div>
    <div id="progress-text"></div>
  </div>

  <main id="screen-root"></main>

  <script src="js/data.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/questions.js"></script>

  <script src="js/app.js"></script>

</html>
